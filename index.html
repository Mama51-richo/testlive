<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ሶያም ገበያ | Soyam Gebeya</title>
<style>
  :root {
    --green: #078930; --yellow: #FCDD09; --red: #DA121A;
    --bg: #f5f6f7; --card: #fff; --ink: #1a1a1a;
    --muted: #6b7280; --line: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Noto Sans Ethiopic", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.4;
  }
  .app {
    max-width: 430px; height: 100vh; height: 100dvh;
    margin: 0 auto; background: var(--card);
    display: flex; flex-direction: column; position: relative;
    overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.15);
  }
  .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .screen.active { display: flex; }
  .screen-body { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
  .screen-body::-webkit-scrollbar { width: 0; }

  .topbar {
    background: linear-gradient(135deg, var(--green), #046b25);
    color: #fff; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar .brand { font-weight: 700; font-size: 15px; }
  .topbar .brand small { display: block; font-size: 10px; opacity: .85; font-weight: 400; }
  .topbar .lang {
    background: rgba(255,255,255,.2); padding: 4px 10px;
    border-radius: 20px; font-size: 11px; cursor: pointer;
  }
  .topbar.back-only { justify-content: flex-start; gap: 10px; }
  .back-btn {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    width: 30px; height: 30px; border-radius: 50%;
    font-size: 14px; cursor: pointer;
  }

  .splash {
    flex: 1;
    background: linear-gradient(160deg, var(--green) 0%, #046b25 60%, #024a19 100%);
    color: #fff; text-align: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  .splash .logo {
    width: 100px; height: 100px; background: var(--yellow);
    border-radius: 24px; display: flex;
    align-items: center; justify-content: center;
    font-size: 48px; font-weight: 800; color: var(--green);
    box-shadow: 0 10px 30px rgba(0,0,0,.35); margin-bottom: 22px;
  }
  .splash h1 { font-size: 30px; margin-bottom: 6px; }
  .splash p { font-size: 13px; opacity: .9; }
  .splash .sub { margin-top: 8px; font-size: 11px; opacity: .75; }
  .splash .stripes { display: flex; gap: 8px; margin-top: 28px; }
  .splash .stripes span { width: 44px; height: 6px; border-radius: 3px; }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line);
    border-radius: 12px; font-size: 14px; background: #fafafa; font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .btn {
    display: block; width: 100%; padding: 12px;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: opacity .15s;
  }
  .btn:active { opacity: .8; }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-outline { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .btn-yellow { background: var(--yellow); color: #1a1a1a; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-sm { padding: 7px 11px; font-size: 12px; width: auto; display: inline-block; border-radius: 8px; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row .btn { flex: 1; }

  .searchbar {
    display: flex; gap: 8px; background: #fff;
    padding: 9px 12px; border-radius: 14px;
    border: 1px solid var(--line); align-items: center;
  }
  .searchbar input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; font-family: inherit; }
  .searchbar .icon { color: var(--muted); }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-top: 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 6px 13px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 20px; font-size: 12px; font-weight: 600;
    white-space: nowrap; cursor: pointer;
  }
  .chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  .sec-title { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 8px; }
  .sec-title h3 { font-size: 14px; }
  .sec-title a { font-size: 11px; color: var(--green); font-weight: 600; text-decoration: none; cursor: pointer; }

  .listing {
    display: flex; gap: 10px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; margin-bottom: 9px;
    cursor: pointer;
  }
  .listing .thumb {
    width: 68px; height: 68px;
    background: linear-gradient(135deg, #e8f5ec, #d3ecd9);
    border-radius: 10px; display: flex;
    align-items: center; justify-content: center;
    font-size: 26px; flex: 0 0 auto;
  }
  .listing .info { flex: 1; min-width: 0; }
  .listing .info h4 { font-size: 13px; margin-bottom: 2px; }
  .listing .info .meta { font-size: 10.5px; color: var(--muted); margin-bottom: 5px; }
  .listing .price { font-size: 13px; font-weight: 800; color: var(--green); }
  .listing .price small { font-weight: 400; color: var(--muted); font-size: 10px; }

  .badge {
    display: inline-block; background: var(--yellow); color: #1a1a1a;
    font-size: 9.5px; font-weight: 700; padding: 2px 7px;
    border-radius: 20px; margin-left: 4px;
  }
  .badge.green { background: #d1f2da; color: var(--green); }
  .badge.red { background: #fde0e2; color: var(--red); }
  .badge.blue { background: #dbeafe; color: #1e40af; }

  .bottomnav {
    display: flex; border-top: 1px solid var(--line);
    background: #fff; flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .bottomnav div {
    flex: 1; text-align: center; padding: 8px 4px 6px;
    font-size: 10px; color: var(--muted); cursor: pointer;
  }
  .bottomnav div.active { color: var(--green); font-weight: 700; }
  .bottomnav div .ico { font-size: 18px; display: block; margin-bottom: 1px; }

  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .card h4 { font-size: 13px; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: none; }
  .row span:last-child { color: var(--muted); }

  .verified-strip { display: flex; gap: 9px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
  .verified-strip::-webkit-scrollbar { display: none; }
  .verified-seller {
    flex: 0 0 auto; width: 118px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 8px; text-align: center;
    position: relative; cursor: pointer;
  }
  .verified-seller .avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, #e8f5ec, #b8e0c4);
    margin: 0 auto 6px; display: flex;
    align-items: center; justify-content: center;
    font-size: 22px; border: 2px solid var(--green);
  }
  .verified-seller .name { font-size: 11px; font-weight: 700; margin-bottom: 1px; }
  .verified-seller .meta { font-size: 9.5px; color: var(--muted); }
  .verified-seller .check {
    position: absolute; top: 5px; right: 5px;
    background: var(--green); color: #fff;
    width: 16px; height: 16px; border-radius: 50%;
    font-size: 10px; display: flex;
    align-items: center; justify-content: center;
  }

  .trending-strip { display: flex; gap: 9px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; }
  .trending-strip::-webkit-scrollbar { display: none; }
  .trend-card {
    flex: 0 0 auto; width: 138px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    position: relative; cursor: pointer;
  }
  .trend-card .img {
    height: 88px; background: linear-gradient(135deg, #e8f5ec, #d3ecd9);
    display: flex; align-items: center; justify-content: center; font-size: 38px;
  }
  .trend-card .info { padding: 7px 9px; }
  .trend-card .info h5 { font-size: 11px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trend-card .info .price { font-size: 11.5px; color: var(--green); font-weight: 800; }
  .trend-card .hot {
    position: absolute; top: 5px; left: 5px;
    background: var(--red); color: #fff;
    font-size: 8.5px; padding: 2px 6px;
    border-radius: 20px; font-weight: 700;
  }

  .megamenu { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .megamenu details { border-bottom: 1px solid var(--line); }
  .megamenu details:last-child { border-bottom: none; }
  .megamenu summary {
    list-style: none; cursor: pointer;
    padding: 12px 13px; font-weight: 700; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .megamenu summary::-webkit-details-marker { display: none; }
  .megamenu summary::after { content: "▾"; color: var(--muted); font-size: 11px; }
  .megamenu details[open] summary::after { content: "▴"; }
  .megamenu .sub { padding: 0 13px 12px 13px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .megamenu .sub a {
    font-size: 10.5px; color: #374151; text-decoration: none;
    padding: 6px 8px; background: #f8fafc; border-radius: 8px;
    cursor: pointer;
  }

  .rfq {
    background: linear-gradient(135deg, #fff7d6, #fde68a);
    border: 1px dashed #d4a017; border-radius: 14px;
    padding: 12px; margin: 12px 0;
  }
  .rfq h4 { font-size: 13px; margin-bottom: 3px; color: #7c5800; }
  .rfq p { font-size: 10.5px; color: #92680a; margin-bottom: 8px; }
  .rfq .btn { padding: 9px; font-size: 12px; }

  .supplier-hero {
    background: linear-gradient(135deg, var(--green), #046b25);
    color: #fff; padding: 18px 16px; text-align: center; flex-shrink: 0;
  }
  .supplier-hero .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--yellow); color: var(--green);
    margin: 0 auto 8px; display: flex;
    align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800;
  }
  .supplier-hero h3 { font-size: 16px; }
  .supplier-hero p { font-size: 10.5px; opacity: .9; margin-top: 2px; }
  .supplier-hero .verif {
    display: inline-block; margin-top: 6px;
    background: rgba(255,255,255,.2);
    padding: 3px 10px; border-radius: 20px; font-size: 10px;
  }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 12px; }
  .stat-grid .stat { text-align: center; padding: 7px; background: #f8fafc; border-radius: 10px; }
  .stat-grid .stat b { display: block; font-size: 15px; color: var(--green); }
  .stat-grid .stat span { font-size: 9.5px; color: var(--muted); }

  .detail-hero {
    background: linear-gradient(135deg, #e8f5ec, #d3ecd9);
    height: 130px; display: flex;
    align-items: center; justify-content: center; font-size: 54px;
  }

  .admin-head {
    background: #1a1a1a; color: #fff;
    padding: 12px 16px; font-size: 13px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .admin-head .phone { font-size: 10.5px; opacity: .7; }

  .wallet-card {
    background: linear-gradient(135deg, var(--green), #046b25);
    color: #fff; border-radius: 18px;
    padding: 20px; text-align: center; margin-bottom: 12px;
  }
  .wallet-card .label { font-size: 11.5px; opacity: .85; }
  .wallet-card .amount { font-size: 32px; font-weight: 800; margin: 5px 0; }
  .wallet-card .rate { font-size: 11px; background: rgba(255,255,255,.15); display: inline-block; padding: 3px 10px; border-radius: 20px; }

  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--muted); font-size: 13px;
  }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1a1a1a; color: #fff; padding: 10px 18px;
    border-radius: 24px; font-size: 13px; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 90%;
  }
  .toast.show { opacity: 1; }

  .role-tag {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 10px; font-weight: 700; margin-left: 6px;
  }
  .role-tag.admin { background: #fde0e2; color: var(--red); }
  .role-tag.seller { background: #d1f2da; color: var(--green); }
  .role-tag.buyer { background: #dbeafe; color: #1e40af; }

  @media (min-width: 500px) {
    body { background: linear-gradient(135deg, #0f172a, #1e293b); padding: 20px 0; }
    .app { border-radius: 28px; height: calc(100vh - 40px); border: 8px solid #0f172a; }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SOYAM GEBEYA — FULLY FUNCTIONAL PROTOTYPE
   Data stored in localStorage (per device)
   ============================================================ */

const ADMIN_PHONE = '+251920353460';
const COIN_RATE = 10; // 1 coin = 10 ETB

/* ---------- STORAGE ---------- */
const DB = {
  get(key, fallback) {
    try { return JSON.parse(localStorage.getItem('soyam_' + key)) ?? fallback; }
    catch { return fallback; }
  },
  set(key, val) { localStorage.setItem('soyam_' + key, JSON.stringify(val)); }
};

/* ---------- INITIAL SEED ---------- */
function seed() {
  if (!DB.get('users')) {
    const users = [
      { id:'u_admin', name:'Platform Admin', phone:ADMIN_PHONE, role:'admin', city:'Addis Ababa', region:'Addis Ababa', status:'active', coins:100000 },
      { id:'u_abebe', name:'Abebe Tesfaye', phone:'+251911111111', role:'seller', city:'Bahir Dar', region:'Amhara', status:'active', coins:250, sellerId:'s_abebe' },
      { id:'u_hanna', name:'Hanna Girma', phone:'+251922222222', role:'seller', city:'Hawassa', region:'Sidama', status:'active', coins:80, sellerId:'s_hanna' },
      { id:'u_sara', name:'Sara Mekonnen', phone:'+251933333333', role:'buyer', city:'Addis Ababa', region:'Addis Ababa', status:'active', coins:50 }
    ];
    DB.set('users', users);
  }

  if (!DB.get('sellers')) {
    const sellers = [
      { id:'s_abebe', name:'Abebe Farms', phone:'+251911111111', city:'Bahir Dar', region:'Amhara', size:'Cooperative', type:'Product Seller', status:'approved', icon:'🌾', rating:4.8, orders:126 },
      { id:'s_hanna', name:'Hanna Plumbing', phone:'+251922222222', city:'Hawassa', region:'Sidama', size:'Freelancer', type:'Technician', status:'approved', icon:'🔧', rating:4.6, orders:48 },
      { id:'s_kebede', name:'Kebede Electronics', phone:'+251944444444', city:'Adama', region:'Oromia', size:'Small Business', type:'Product Seller', status:'pending', icon:'🏪', rating:0, orders:0 },
      { id:'s_wood', name:'Wood Works ET', phone:'+251955555555', city:'Hawassa', region:'Sidama', size:'Micro Business', type:'Manufacturer', status:'approved', icon:'🪑', rating:4.7, orders:62 }
    ];
    DB.set('sellers', sellers);
  }

  if (!DB.get('listings')) {
    const listings = [
      { id:'l_1', title:'Organic Teff — 100kg', type:'product', category:'Agriculture Products', price:8500, negotiable:true, city:'Bahir Dar', region:'Amhara', sellerId:'s_abebe', icon:'🌾', description:'Freshly harvested organic teff from local farms. Clean, sorted, ready for delivery.', status:'active', createdAt:Date.now() },
      { id:'l_2', title:'Phone Repair Service', type:'service', category:'Phone Repair', price:500, negotiable:false, city:'Addis Ababa', region:'Addis Ababa', sellerId:'s_hanna', icon:'📱', description:'Fast and reliable phone repair. Screen, battery, software.', status:'active', createdAt:Date.now() },
      { id:'l_3', title:'Handmade Wooden Chair', type:'product', category:'Furniture', price:2300, negotiable:true, city:'Hawassa', region:'Sidama', sellerId:'s_wood', icon:'🪑', description:'Handcrafted traditional wooden chair. Strong and durable.', status:'active', createdAt:Date.now() },
      { id:'l_4', title:'Logo & Brand Design', type:'skill', category:'Graphic Design', price:1500, negotiable:false, city:'Adama', region:'Oromia', sellerId:'s_abebe', icon:'🎨', description:'Professional logo and brand identity design.', status:'active', createdAt:Date.now() },
      { id:'l_5', title:'Fresh Maize — 50kg', type:'product', category:'Agriculture Products', price:3200, negotiable:true, city:'Bahir Dar', region:'Amhara', sellerId:'s_abebe', icon:'🌽', description:'Fresh maize from Bahir Dar farms.', status:'active', createdAt:Date.now() }
    ];
    DB.set('listings', listings);
  }

  if (!DB.get('orders')) DB.set('orders', []);
  if (!DB.get('coinRequests')) DB.set('coinRequests', []);
  if (!DB.get('session')) DB.set('session', null);
}
seed();

/* ---------- HELPERS ---------- */
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function me(){ return DB.get('session', null); }
function user(){ const s = me(); return s ? DB.get('users').find(u => u.id === s.userId) : null; }
function sellerById(id){ return DB.get('sellers').find(s => s.id === id); }
function listingById(id){ return DB.get('listings').find(l => l.id === id); }
function updateUser(u){ const arr = DB.get('users'); const i = arr.findIndex(x => x.id === u.id); arr[i] = u; DB.set('users', arr); }
function updateSeller(s){ const arr = DB.get('sellers'); const i = arr.findIndex(x => x.id === s.id); arr[i] = s; DB.set('sellers', arr); }

/* ---------- NAVIGATION ---------- */
let currentScreen = 's-splash';
let backStack = [];

function go(id, skipStack){
  if (!skipStack && currentScreen && currentScreen !== id) backStack.push(currentScreen);
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('active');
  currentScreen = id;

  document.querySelectorAll('.bottomnav div').forEach(d => {
    d.classList.toggle('active', d.dataset.target === id);
  });
  const sb = el.querySelector('.screen-body');
  if (sb) sb.scrollTop = 0;

  // Render screen-specific dynamic content
  if (id === 's-home') renderHome();
  if (id === 's-search') renderSearchResults();
  if (id === 's-categories') renderCategories();
  if (id === 's-wallet') renderWallet();
  if (id === 's-profile') renderProfile();
  if (id === 's-dashboard') renderDashboard();
  if (id === 's-myorders') renderMyOrders();
  if (id === 's-admin') renderAdmin();
  if (id === 's-admin-sellers') renderAdminSellers();
  if (id === 's-admin-coins') renderAdminCoins();
}
window.go = go;

function back(){
  const prev = backStack.pop();
  go(prev || 's-home', true);
}
window.back = back;

/* ============================================================
   BUILD APP SHELL
   ============================================================ */
const app = document.getElementById('app');
app.innerHTML = `
  <!-- SPLASH -->
  <div class="screen active" id="s-splash">
    <div class="splash">
      <div class="logo">ሶ</div>
      <h1>ሶያም ገበያ</h1>
      <p>Soyam Gebeya — Everything Market</p>
      <p class="sub">Every product · service · skill · idea · knowledge</p>
      <div class="stripes">
        <span style="background:#078930"></span>
        <span style="background:#FCDD09"></span>
        <span style="background:#DA121A"></span>
      </div>
      <button class="btn btn-yellow" style="margin-top:40px; max-width:240px;" onclick="go('s-login')">Get Started / ጀምር</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="screen" id="s-login">
    <div class="topbar">
      <div class="brand">ሶያም ገበያ <small>Soyam Gebeya</small></div>
      <div class="lang">አማ / EN</div>
    </div>
    <div class="screen-body">
      <h3 style="margin-bottom:4px;">እንኳን ደህና መጡ</h3>
      <p style="font-size:12px; color:var(--muted); margin-bottom:16px;">Welcome — log in or register</p>

      <div class="field">
        <label>Phone Number / ስልክ ቁጥር</label>
        <input id="loginPhone" type="tel" placeholder="+251 9XX XXX XXX" />
      </div>

      <div class="field">
        <label>Full Name (only for new users)</label>
        <input id="loginName" placeholder="ሙሉ ስም / Full Name" />
      </div>

      <div class="field">
        <label>Role</label>
        <select id="loginRole">
          <option value="buyer">Buyer / ገዢ</option>
          <option value="seller">Seller / ሻጭ</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="doLogin()">Continue / ቀጥል</button>

function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const name = document.getElementById('loginName').value.trim();
  const role = document.getElementById('loginRole').value;

  if (!phone) { toast('Enter a phone number'); return; }

  // Normalize: ensure starts with +
  const norm = phone.startsWith('+') ? phone : ('+' + phone.replace(/\D/g, ''));

  let users = DB.get('users');
  let user = users.find(u => u.phone === norm);

  if (!user) {
    if (!name) { toast('Enter your full name to register'); return; }
    // New user
    const isAdmin = norm === ADMIN_PHONE;
    user = {
      id: uid('u'), name, phone: norm,
      role: isAdmin ? 'admin' : role,
      city: 'Addis Ababa', region: 'Addis Ababa',
      status: 'active',
      coins: isAdmin ? 100000 : 0
    };
    users.push(user);
    DB.set('users', users);

    // If seller, create seller record (pending approval)
    if (user.role === 'seller') {
      const sellers = DB.get('sellers');
      const sid = uid('s');
      sellers.push({
        id: sid, name: user.name, phone: user.phone,
        city: user.city, region: user.region,
        size: 'Individual', type: 'Product Seller',
        status: 'pending', icon: '🏪', rating: 0, orders: 0
      });
      DB.set('sellers', sellers);
      user.sellerId = sid;
      updateUser(user);
    }
    toast('Welcome, ' + name + '!');
  } else {
    toast('Welcome back, ' + user.name + '!');
  }

  // Enforce admin
  if (norm === ADMIN_PHONE && user.role !== 'admin') {
    user.role = 'admin';
    updateUser(user);
  }

  DB.set('session', { userId: user.id, loggedInAt: Date.now() });

  // Route
  if (user.role === 'admin') go('s-admin');
  else if (user.role === 'seller') go('s-home');
  else go('s-home');
}
window.doLogin = doLogin;

function logout() {
  if (!confirm('Log out?')) return;
  DB.set('session', null);
  backStack = [];
  go('s-login', true);
}
window.logout = logout;

function doSearch(q) {
  searchState.q = q;
  applyFilters();
}
window.doSearch = doSearch;

function applyFilters() {
  const listings = DB.get('listings').filter(l => l.status === 'active');
  const sellers = DB.get('sellers');

  let filtered = listings.filter(l => {
    if (searchState.q && !(l.title.toLowerCase().includes(searchState.q.toLowerCase()) || l.category.toLowerCase().includes(searchState.q.toLowerCase()) || l.description.toLowerCase().includes(searchState.q.toLowerCase()))) return false;
    if (searchState.city && l.city !== searchState.city) return false;
    if (searchState.region && l.region !== searchState.region) return false;
    if (searchState.category && l.category !== searchState.category) return false;
    if (searchState.size || searchState.type) {
      const s = sellers.find(x => x.id === l.sellerId);
      if (!s) return false;
      if (searchState.size && s.size !== searchState.size) return false;
      if (searchState.type && s.type !== searchState.type) return false;
    }
    return true;
  });

  const el = document.getElementById('searchResults');
  const countEl = document.getElementById('resultCount');
  if (countEl) countEl.textContent = `Results (${filtered.length})`;
  if (!el) return;

  el.innerHTML = filtered.length ? filtered.map(l => {
    const s = sellerById(l.sellerId);
    return `
      <div class="listing" onclick="openDetail('${l.id}')">
        <div class="thumb">${l.icon || '📦'}</div>
        <div class="info">
          <h4>${esc(l.title)} ${s && s.status === 'approved' ? '<span class="badge green">Verified</span>' : ''}</h4>
          <div class="meta">📍 ${esc(l.city)} · ${esc(l.category)}</div>
          <div class="price">ETB ${l.price.toLocaleString()}</div>
        </div>
      </div>
    `;
  }).join('') : '<div class="empty"><div class="big">🔍</div><p>No listings match your filters.</p></div>';
}
window.applyFilters = applyFilters;

function clearFilters() {
  searchState = { q:'', region:'', city:'', size:'', type:'', category:'' };
  renderSearchResults();
}
window.clearFilters = clearFilters;

function orderCard(o, perspective) {
  const statusColor = { 'Pending':'badge red', 'Confirmed':'badge blue', 'Shipped':'badge', 'Delivered':'badge green', 'Cancelled':'badge red' }[o.status] || 'badge';
  return `
    <div class="card">
      <div class="row"><span><b>${esc(o.listingTitle)}</b></span><span class="${statusColor}">${o.status}</span></div>
      <div class="row"><span>${perspective === 'buyer' ? 'Seller' : 'Buyer'}</span><span>${esc(perspective === 'buyer' ? o.sellerName : o.buyerName)}</span></div>
      <div class="row"><span>Qty</span><span>${o.qty}</span></div>
      <div class="row"><span>Type</span><span>${esc(o.type)}</span></div>
      <div class="row"><span>Total</span><span><b style="color:var(--green);">ETB ${o.total.toLocaleString()}</b></span></div>
      <div class="row"><span>Date</span><span>${new Date(o.date).toLocaleDateString()}</span></div>
      ${perspective === 'seller' && o.status === 'Pending' ? `
        <div class="btn-row">
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="updateOrder('${o.id}','Cancelled')">Cancel</button>
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="updateOrder('${o.id}','Confirmed')">Confirm</button>
        </div>` : ''}
      ${perspective === 'seller' && o.status === 'Confirmed' ? `
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="updateOrder('${o.id}','Shipped')">Mark Shipped</button>
        </div>` : ''}
      ${perspective === 'buyer' && o.status === 'Shipped' ? `
        <div class="btn-row">
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="updateOrder('${o.id}','Delivered')">Mark Delivered</button>
        </div>` : ''}
    </div>
  `;
}

function updateOrder(id, status) {
  const orders = DB.get('orders');
  const o = orders.find(x => x.id === id);
  if (!o) return;
  o.status = status;
  DB.set('orders', orders);
  toast('Order ' + status);
  renderMyOrders();
}
window.updateOrder = updateOrder;

function saveListing() {
  const u = user();
  const title = document.getElementById('lfTitleIn').value.trim();
  const type = document.getElementById('lfType').value;
  const category = document.getElementById('lfCat').value;
  const description = document.getElementById('lfDesc').value.trim();
  const price = parseFloat(document.getElementById('lfPrice').value) || 0;
  const negotiable = document.getElementById('lfNeg').value === 'true';
  const city = document.getElementById('lfCity').value;
  const icon = document.getElementById('lfIcon').value || '📦';

  if (!title) { toast('Title required'); return; }
  if (!price) { toast('Price required'); return; }

  const arr = DB.get('listings');
  if (editingListingId) {
    const i = arr.findIndex(l => l.id === editingListingId);
    arr[i] = { ...arr[i], title, type, category, description, price, negotiable, city, icon };
    toast('Listing updated ✅');
  } else {
    arr.push({
      id: uid('l'), title, type, category, description, price, negotiable,
      city, region: u.region, sellerId: u.sellerId, icon,
      status: 'active', createdAt: Date.now()
    });
    toast('Listing published ✅');
  }
  DB.set('listings', arr);
  editingListingId = null;
  go('s-dashboard');
}
window.saveListing = saveListing;

      <div class="row" onclick="go('s-admin-sellers')" style="cursor:pointer;"><span>🏪 Manage Sellers</span><span>→</span></div>
      <div class="row" onclick="go('s-admin-coins')" style="cursor:pointer;"><span>🪙 Coin Requests</span><span>→</span></div>
      <div class="row" onclick="toast('Cities management (demo)')" style="cursor:pointer;"><span>🏙️ Manage Cities</span><span>→</span></div>
      <div class="row" onclick="toast('Categories management (demo)')" style="cursor:pointer;"><span>📂 Manage Categories</span><span>→</span></div>
      <div class="row" onclick="toast('All listings viewed')" style="cursor:pointer;"><span>📊 Monitor Listings</span><span>→</span></div>
      <div class="row" onclick="toast('Orders monitor (demo)')" style="cursor:pointer;"><span>🧾 All Orders</span><span>→</span></div>
      <div class="row" onclick="toast('Blocked users (demo)')" style="cursor:pointer;"><span>🚫 Blocked Users</span><span>→</span></div>
    </div>
  `;
}
window.renderAdmin = renderAdmin;

function renderAdminSellers() {
  const sellers = DB.get('sellers');
  document.getElementById('adminSellersBody').innerHTML = sellers.map(s => `
    <div class="card">
      <div class="row"><span><b>${esc(s.name)}</b></span><span class="${s.status==='approved'?'badge green':s.status==='pending'?'badge red':'badge'}">${s.status}</span></div>
      <div class="row"><span>📞 Phone</span><span>${esc(s.phone)}</span></div>
      <div class="row"><span>📍 Location</span><span>${esc(s.city)}, ${esc(s.region)}</span></div>
      <div class="row"><span>🏢 Size / Type</span><span>${esc(s.size)} · ${esc(s.type)}</span></div>
      <div class="btn-row">
        ${s.status !== 'approved' ? `<button class="btn btn-primary btn-sm" style="flex:1;" onclick="approveSeller('${s.id}')">✔ Approve</button>` : ''}
        ${s.status !== 'blocked' ? `<button class="btn btn-red btn-sm" style="flex:1;" onclick="blockSeller('${s.id}')">🚫 Block</button>` : `<button class="btn btn-primary btn-sm" style="flex:1;" onclick="approveSeller('${s.id}')">Unblock</button>`}
      </div>
    </div>
  `).join('');
}
window.renderAdminSellers = renderAdminSellers;

function approveSeller(id) {
  const s = sellerById(id);
  s.status = 'approved';
  updateSeller(s);
  toast('Seller approved ✅');
  renderAdminSellers();
  renderAdmin();
}
window.approveSeller = approveSeller;

function blockSeller(id) {
  const s = sellerById(id);
  s.status = 'blocked';
  updateSeller(s);
  toast('Seller blocked');
  renderAdminSellers();
  renderAdmin();
}
window.blockSeller = blockSeller;

function renderAdminCoins() {
  const reqs = DB.get('coinRequests');
  const el = document.getElementById('adminCoinsBody');
  if (!reqs.length) { el.innerHTML = '<div class="empty"><div class="big">🪙</div><p>No coin requests yet.</p></div>'; return; }
  el.innerHTML = reqs.slice().reverse().map(r => `
    <div class="card">
      <div class="row"><span><b>${esc(r.userName)}</b></span><span style="color:${r.status==='approved'?'var(--green)':r.status==='rejected'?'var(--red)':'#92680a'};font-weight:700;">${r.status}</span></div>
      <div class="row"><span>📞 Phone</span><span>${esc(r.phone)}</span></div>
      <div class="row"><span>🪙 Requested</span><span>${r.coins} ሳንቲም = ETB ${r.etb.toLocaleString()}</span></div>
      <div class="row"><span>💳 Method</span><span>${esc(r.method)}</span></div>
      <div class="row"><span>🧾 FT Number</span><span>${esc(r.ft)}</span></div>
      ${r.status === 'pending' ? `
        <div class="btn-row">
          <button class="btn btn-red btn-sm" style="flex:1;" onclick="rejectCoin('${r.id}')">✖ Reject</button>
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="approveCoin('${r.id}')">✔ Approve & Credit</button>
        </div>` : ''}
    </div>
  `).join('');
}
window.renderAdminCoins = renderAdminCoins;

function approveCoin(id) {
  const reqs = DB.get('coinRequests');
  const r = reqs.find(x => x.id === id);
  if (!r || r.status !== 'pending') return;

  const users = DB.get('users');
  const u = users.find(x => x.id === r.userId);
  const admin = users.find(x => x.phone === ADMIN_PHONE);

  if (!u || !admin) { toast('User not found'); return; }
  if (admin.coins < r.coins) { toast('Admin wallet insufficient'); return; }

  admin.coins -= r.coins;
  u.coins += r.coins;
  r.status = 'approved';
  r.approvedAt = Date.now();

  DB.set('users', users);
  DB.set('coinRequests', reqs);

  // Update session user if it's this user
  if (me()?.userId === u.id) { /* session unchanged */ }

  toast(`✅ Approved — ${u.name} now has ${u.coins} coins`);
  renderAdminCoins();
  renderAdmin();
}
window.approveCoin = approveCoin;

function rejectCoin(id) {
  const reqs = DB.get('coinRequests');
  const r = reqs.find(x => x.id === id);
  if (!r) return;
  r.status = 'rejected';
  DB.set('coinRequests', reqs);
  toast('Request rejected');
  renderAdminCoins();
  renderAdmin();
}
window.rejectCoin = rejectCoin;

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  const session = me();
  if (session) {
    const u = user();
    if (u) {
      if (u.role === 'admin') go('s-admin', true);
      else go('s-home', true);
      return;
    }
  }
  go('s-splash', true);
})();
</script>
</body>
</html>
