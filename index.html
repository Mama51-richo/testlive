<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ሶያም ገበያ | Soyam Gebeya</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"Noto Sans Ethiopic","Segoe UI",Roboto,sans-serif;background:#eef1f3;color:#1a1a1a;line-height:1.4}
  .app{max-width:430px;height:100vh;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}
  .screen{display:none;flex:1;flex-direction:column;overflow:hidden}
  .screen.active{display:flex}
  .screen-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
  .screen-body::-webkit-scrollbar{width:0}

  .topbar{background:linear-gradient(135deg,#078930,#046b25);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .topbar .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
  .topbar .brand small{display:block;font-size:10px;opacity:.85;font-weight:400}
  .topbar .lang{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:11px;cursor:pointer}
  .topbar.back-only{justify-content:flex-start;gap:10px}
  .back-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}

  /* LOGO */
  .logo-mark{width:34px;height:34px;background:#FCDD09;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#078930;font-size:17px;flex-shrink:0}
  .logo-mark.lg{width:104px;height:104px;border-radius:26px;font-size:0;margin:0 auto 22px;background:linear-gradient(135deg,#FCDD09,#f7c900);box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex}
  .logo-mark.lg svg{width:66px;height:66px}

  /* SPLASH */
  .splash{flex:1;background:linear-gradient(160deg,#078930 0%,#046b25 60%,#024a19 100%);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .splash h1{font-size:30px;margin-bottom:6px}
  .splash p{font-size:13px;opacity:.92}
  .splash .sub{margin-top:8px;font-size:11px;opacity:.75}
  .splash .stripes{display:flex;gap:8px;margin-top:26px}
  .splash .stripes span{width:44px;height:6px;border-radius:3px}

  /* FORM */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#6b7280}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid #e5e7eb;border-radius:12px;font-size:14px;background:#fafafa;font-family:inherit}
  .field textarea{resize:vertical;min-height:70px}
  .btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
  .btn:active{opacity:.75}
  .btn-primary{background:#078930;color:#fff}
  .btn-outline{background:#fff;color:#078930;border:2px solid #078930}
  .btn-yellow{background:#FCDD09;color:#1a1a1a}
  .btn-red{background:#DA121A;color:#fff}
  .btn-sm{padding:7px 11px;font-size:12px;width:auto;display:inline-block;border-radius:8px}
  .btn-row{display:flex;gap:8px;margin-top:10px}
  .btn-row .btn{flex:1}

  .searchbar{display:flex;gap:8px;background:#fff;padding:9px 12px;border-radius:14px;border:1px solid #e5e7eb;align-items:center}
  .searchbar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;font-family:inherit}
  .searchbar .icon{color:#6b7280;font-size:15px}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin-top:6px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:6px 13px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
  .chip.active{background:#078930;color:#fff;border-color:#078930}

  .sec-title{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}
  .sec-title h3{font-size:14px}
  .sec-title a{font-size:11px;color:#078930;font-weight:600;text-decoration:none;cursor:pointer}

  .listing{display:flex;gap:10px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin-bottom:9px;cursor:pointer}
  .listing .thumb{width:68px;height:68px;background:linear-gradient(135deg,#e8f5ec,#d3ecd9);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
  .listing .info{flex:1;min-width:0}
  .listing .info h4{font-size:13px;margin-bottom:2px}
  .listing .info .meta{font-size:10.5px;color:#6b7280;margin-bottom:5px}
  .listing .price{font-size:13px;font-weight:800;color:#078930}
  .listing .price small{font-weight:400;color:#6b7280;font-size:10px}
  .badge{display:inline-block;background:#FCDD09;color:#1a1a1a;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:4px}
  .badge.green{background:#d1f2da;color:#078930}
  .badge.red{background:#fde0e2;color:#DA121A}
  .badge.blue{background:#dbeafe;color:#1e40af}

  .bottomnav{display:flex;border-top:1px solid #e5e7eb;background:#fff;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav div{flex:1;text-align:center;padding:8px 4px 6px;font-size:10px;color:#6b7280;cursor:pointer}
  .bottomnav div.active{color:#078930;font-weight:700}
  .bottomnav div .ico{font-size:18px;display:block;margin-bottom:1px}

  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:10px}
  .card h4{font-size:13px;margin-bottom:6px}
  .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #e5e7eb}
  .row:last-child{border-bottom:none}
  .row span:last-child{color:#6b7280}

  .verified-strip{display:flex;gap:9px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .verified-strip::-webkit-scrollbar{display:none}
  .verified-seller{flex:0 0 auto;width:118px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px 8px;text-align:center;position:relative;cursor:pointer}
  .verified-seller .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#e8f5ec,#b8e0c4);margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid #078930}
  .verified-seller .name{font-size:11px;font-weight:700;margin-bottom:1px}
  .verified-seller .meta{font-size:9.5px;color:#6b7280}
  .verified-seller .check{position:absolute;top:5px;right:5px;background:#078930;color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}

  .trending-strip{display:flex;gap:9px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .trending-strip::-webkit-scrollbar{display:none}
  .trend-card{flex:0 0 auto;width:138px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;position:relative;cursor:pointer}
  .trend-card .img{height:88px;background:linear-gradient(135deg,#e8f5ec,#d3ecd9);display:flex;align-items:center;justify-content:center;font-size:38px}
  .trend-card .info{padding:7px 9px}
  .trend-card .info h5{font-size:11px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trend-card .info .price{font-size:11.5px;color:#078930;font-weight:800}
  .trend-card .hot{position:absolute;top:5px;left:5px;background:#DA121A;color:#fff;font-size:8.5px;padding:2px 6px;border-radius:20px;font-weight:700}

  .megamenu{background:#fff;border:1px solid #e5e7eb;border-radius:14px;overflow:hidden}
  .megamenu details{border-bottom:1px solid #e5e7eb}
  .megamenu details:last-child{border-bottom:none}
  .megamenu summary{list-style:none;cursor:pointer;padding:12px 13px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .megamenu summary::-webkit-details-marker{display:none}
  .megamenu summary::after{content:"▾";color:#6b7280;font-size:11px}
  .megamenu details[open] summary::after{content:"▴"}
  .megamenu .sub{padding:0 13px 12px 13px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .megamenu .sub a{font-size:10.5px;color:#374151;text-decoration:none;padding:6px 8px;background:#f8fafc;border-radius:8px;cursor:pointer}

  .rfq{background:linear-gradient(135deg,#fff7d6,#fde68a);border:1px dashed #d4a017;border-radius:14px;padding:12px;margin:12px 0}
  .rfq h4{font-size:13px;margin-bottom:3px;color:#7c5800}
  .rfq p{font-size:10.5px;color:#92680a;margin-bottom:8px}
  .rfq .btn{padding:9px;font-size:12px}

  .supplier-hero{background:linear-gradient(135deg,#078930,#046b25);color:#fff;padding:18px 16px;text-align:center;flex-shrink:0}
  .supplier-hero .avatar{width:64px;height:64px;border-radius:50%;background:#FCDD09;color:#078930;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
  .supplier-hero h3{font-size:16px}
  .supplier-hero p{font-size:10.5px;opacity:.92;margin-top:2px}
  .supplier-hero .verif{display:inline-block;margin-top:6px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;font-size:10px}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:12px}
  .stat-grid .stat{text-align:center;padding:7px;background:#f8fafc;border-radius:10px}
  .stat-grid .stat b{display:block;font-size:15px;color:#078930}
  .stat-grid .stat span{font-size:9.5px;color:#6b7280}

  .detail-hero{background:linear-gradient(135deg,#e8f5ec,#d3ecd9);height:130px;display:flex;align-items:center;justify-content:center;font-size:54px}

  .admin-head{background:#1a1a1a;color:#fff;padding:12px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  .admin-head .phone{font-size:10.5px;opacity:.7}

  .wallet-card{background:linear-gradient(135deg,#078930,#046b25);color:#fff;border-radius:18px;padding:20px;text-align:center;margin-bottom:12px}
  .wallet-card .label{font-size:11.5px;opacity:.85}
  .wallet-card .amount{font-size:32px;font-weight:800;margin:5px 0}
  .wallet-card .rate{font-size:11px;background:rgba(255,255,255,.18);display:inline-block;padding:3px 10px;border-radius:20px}

  .empty{text-align:center;padding:40px 20px;color:#6b7280;font-size:13px}
  .empty .big{font-size:44px;margin-bottom:8px}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:1000;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
  .toast.show{opacity:1}

  .role-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-left:6px}
  .role-tag.admin{background:#fde0e2;color:#DA121A}
  .role-tag.seller{background:#d1f2da;color:#078930}
  .role-tag.buyer{background:#dbeafe;color:#1e40af}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;display:flex;align-items:flex-end}
  .modal-box{background:#fff;width:100%;max-width:430px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow:auto}

  @media(min-width:500px){
    body{background:linear-gradient(135deg,#0f172a,#1e293b);padding:20px 0}
    .app{border-radius:28px;height:calc(100vh - 40px);border:8px solid #0f172a}
  }
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   SOYAM GEBEYA — FULL WORKING APP
   Storage: localStorage (per device)
   ============================================================ */
(function(){
  'use strict';

  var ADMIN_PHONE = '+251920353460';
  var COIN_RATE = 10;

  /* ---------- LOGO SVG ---------- */
  var LOGO_SVG = '<svg viewBox="0 0 64 64" fill="none">'
    + '<path d="M10 24 L32 10 L54 24 Z" fill="#078930"/>'
    + '<rect x="10" y="24" width="44" height="4" fill="#046b25"/>'
    + '<rect x="14" y="30" width="8" height="22" fill="#078930"/>'
    + '<rect x="28" y="30" width="8" height="22" fill="#078930"/>'
    + '<rect x="42" y="30" width="8" height="22" fill="#078930"/>'
    + '<rect x="10" y="52" width="44" height="4" fill="#046b25"/>'
    + '<circle cx="32" cy="20" r="3" fill="#FCDD09"/>'
    + '</svg>';

  /* ---------- STORAGE ---------- */
  function get(k, fb){ try { var v = localStorage.getItem('soyam_'+k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } }
  function set(k, v){ try { localStorage.setItem('soyam_'+k, JSON.stringify(v)); } catch(e){} }

  /* ---------- SEED ---------- */
  function seed(){
    if(!get('users')){
      set('users', [
        {id:'u_admin', name:'Platform Admin', phone:ADMIN_PHONE, role:'admin', city:'Addis Ababa', region:'Addis Ababa', coins:100000},
        {id:'u_abebe', name:'Abebe Tesfaye', phone:'+251911111111', role:'seller', city:'Bahir Dar', region:'Amhara', coins:250, sellerId:'s_abebe'},
        {id:'u_hanna', name:'Hanna Girma', phone:'+251922222222', role:'seller', city:'Hawassa', region:'Sidama', coins:80, sellerId:'s_hanna'},
        {id:'u_sara', name:'Sara Mekonnen', phone:'+251933333333', role:'buyer', city:'Addis Ababa', region:'Addis Ababa', coins:50}
      ]);
    }
    if(!get('sellers')){
      set('sellers', [
        {id:'s_abebe', name:'Abebe Farms', phone:'+251911111111', city:'Bahir Dar', region:'Amhara', size:'Cooperative', type:'Product Seller', status:'approved', icon:'🌾', rating:4.8, orders:126},
        {id:'s_hanna', name:'Hanna Plumbing', phone:'+251922222222', city:'Hawassa', region:'Sidama', size:'Freelancer', type:'Technician', status:'approved', icon:'🔧', rating:4.6, orders:48},
        {id:'s_kebede', name:'Kebede Electronics', phone:'+251944444444', city:'Adama', region:'Oromia', size:'Small Business', type:'Product Seller', status:'pending', icon:'🏪', rating:0, orders:0},
        {id:'s_wood', name:'Wood Works ET', phone:'+251955555555', city:'Hawassa', region:'Sidama', size:'Micro Business', type:'Manufacturer', status:'approved', icon:'🪑', rating:4.7, orders:62}
      ]);
    }
    if(!get('listings')){
      set('listings', [
        {id:'l_1', title:'Organic Teff — 100kg', type:'product', category:'Agriculture Products', price:8500, negotiable:true, city:'Bahir Dar', region:'Amhara', sellerId:'s_abebe', icon:'🌾', description:'Freshly harvested organic teff from local farms. Clean, sorted, ready for delivery.', status:'active'},
        {id:'l_2', title:'Phone Repair Service', type:'service', category:'Phone Repair', price:500, negotiable:false, city:'Addis Ababa', region:'Addis Ababa', sellerId:'s_hanna', icon:'📱', description:'Fast and reliable phone repair. Screen, battery, software.', status:'active'},
        {id:'l_3', title:'Handmade Wooden Chair', type:'product', category:'Furniture', price:2300, negotiable:true, city:'Hawassa', region:'Sidama', sellerId:'s_wood', icon:'🪑', description:'Handcrafted traditional wooden chair. Strong and durable.', status:'active'},
        {id:'l_4', title:'Logo & Brand Design', type:'skill', category:'Graphic Design', price:1500, negotiable:false, city:'Adama', region:'Oromia', sellerId:'s_abebe', icon:'🎨', description:'Professional logo and brand identity design.', status:'active'},
        {id:'l_5', title:'Fresh Maize — 50kg', type:'product', category:'Agriculture Products', price:3200, negotiable:true, city:'Bahir Dar', region:'Amhara', sellerId:'s_abebe', icon:'🌽', description:'Fresh maize from Bahir Dar farms.', status:'active'}
      ]);
    }
    if(!get('orders')) set('orders', []);
    if(!get('coinRequests')) set('coinRequests', []);
    if(!get('session')) set('session', null);
  }
  seed();

  /* ---------- HELPERS ---------- */
  function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function me(){ return get('session', null); }
  function currentUser(){ var s = me(); return s ? get('users',[]).find(function(u){return u.id===s.userId;}) : null; }
  function sellerById(id){ return get('sellers',[]).find(function(s){return s.id===id;}); }
  function listingById(id){ return get('listings',[]).find(function(l){return l.id===id;}); }
  function updateUser(u){ var arr = get('users',[]); var i = arr.findIndex(function(x){return x.id===u.id;}); if(i>=0){arr[i]=u; set('users',arr);} }
  function updateSeller(s){ var arr = get('sellers',[]); var i = arr.findIndex(function(x){return x.id===s.id;}); if(i>=0){arr[i]=s; set('sellers',arr);} }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastT);
    window._toastT = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  window._toast = toast;

  function closeModal(){
    var m = document.querySelector('.modal-back');
    if(m) m.remove();
  }
  window._closeModal = closeModal;

  /* ---------- NAV ---------- */
  var currentScreen = '';
  var backStack = [];

  function go(id, skipStack){
    if(!skipStack && currentScreen && currentScreen !== id) backStack.push(currentScreen);
    var screens = document.querySelectorAll('.screen');
    for(var i=0;i<screens.length;i++) screens[i].classList.remove('active');
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.add('active');
    currentScreen = id;

    var navs = document.querySelectorAll('.bottomnav div');
    for(var j=0;j<navs.length;j++){
      if(navs[j].getAttribute('data-target') === id) navs[j].classList.add('active');
      else navs[j].classList.remove('active');
    }
    var sb = el.querySelector('.screen-body');
    if(sb) sb.scrollTop = 0;

    if(id === 's-home') renderHome('');
    if(id === 's-search') renderSearch();
    if(id === 's-categories') renderCategories();
    if(id === 's-wallet') renderWallet();
    if(id === 's-profile') renderProfile();
    if(id === 's-dashboard') renderDashboard();
    if(id === 's-myorders') renderMyOrders();
    if(id === 's-admin') renderAdmin();
    if(id === 's-admin-sellers') renderAdminSellers();
    if(id === 's-admin-coins') renderAdminCoins();
  }
  window.go = go;

  function back(){
    var prev = backStack.pop();
    go(prev || 's-home', true);
  }
  window.back = back;

  /* ---------- APP SHELL ---------- */
  var app = document.getElementById('app');

  var html = '';

  /* SPLASH */
  html += '<div class="screen active" id="s-splash">';
  html += '<div class="splash">';
  html += '<div class="logo-mark lg">' + LOGO_SVG + '</div>';
  html += '<h1>ሶያም ገበያ</h1>';
  html += '<p>Soyam Gebeya — Everything Market</p>';
  html += '<p class="sub">Every product · service · skill · idea · knowledge</p>';
  html += '<div class="stripes"><span style="background:#078930"></span><span style="background:#FCDD09"></span><span style="background:#DA121A"></span></div>';
  html += '<button class="btn btn-yellow" style="margin-top:36px; max-width:240px;" onclick="go(\'s-login\')">Get Started / ጀምር</button>';
  html += '</div></div>';

  /* LOGIN */
  html += '<div class="screen" id="s-login">';
  html += '<div class="topbar"><div class="brand"><div class="logo-mark">' + LOGO_SVG + '</div><div>ሶያም ገበያ<small>Soyam Gebeya</small></div></div><div class="lang">አማ/EN</div></div>';
  html += '<div class="screen-body">';
  html += '<h3 style="margin-bottom:4px;">እንኳን ደህና መጡ</h3>';
  html += '<p style="font-size:12px;color:#6b7280;margin-bottom:16px;">Welcome — log in or register</p>';
  html += '<div class="field"><label>Phone Number / ስልክ ቁጥር</label><input id="loginPhone" type="tel" placeholder="+251 9XX XXX XXX" /></div>';
  html += '<div class="field"><label>Full Name (for new users)</label><input id="loginName" placeholder="ሙሉ ስም / Full Name" /></div>';
  html += '<div class="field"><label>Role</label><select id="loginRole"><option value="buyer">Buyer / ገዢ</option><option value="seller">Seller / ሻጭ</option></select></div>';
  html += '<button class="btn btn-primary" onclick="doLogin()">Continue / ቀጥል</button>';
  html += '<div class="card" style="margin-top:18px;background:#f0fdf4;border-color:#bbf7d0;">';
  html += '<h4>Demo Accounts</h4>';
  html += '<div class="row"><span>👤 Buyer (Sara)</span><span>+251933333333</span></div>';
  html += '<div class="row"><span>🛒 Seller (Abebe)</span><span>+251911111111</span></div>';
  html += '<div class="row"><span>🛡️ Admin</span><span>+251920353460</span></div>';
  html += '</div>';
  html += '</div></div>';

  function doLogin(){
    var phone = document.getElementById('loginPhone').value.trim();
    var name = document.getElementById('loginName').value.trim();
    var role = document.getElementById('loginRole').value;
    if(!phone){ toast('Enter a phone number'); return; }
    var norm = phone.charAt(0) === '+' ? phone : ('+' + phone.replace(/\D/g,''));
    var users = get('users',[]);
    var u = users.find(function(x){return x.phone === norm;});
    if(!u){
      if(!name){ toast('Enter your full name to register'); return; }
      var isAdmin = norm === ADMIN_PHONE;
      u = { id: uid('u'), name:name, phone:norm, role: isAdmin?'admin':role, city:'Addis Ababa', region:'Addis Ababa', coins: isAdmin?100000:0 };
      users.push(u);
      set('users', users);
      if(u.role === 'seller'){
        var sellers = get('sellers',[]);
        var sid = uid('s');
        sellers.push({ id:sid, name:u.name, phone:u.phone, city:u.city, region:u.region, size:'Individual', type:'Product Seller', status:'pending', icon:'🏪', rating:0, orders:0 });
        set('sellers', sellers);
        u.sellerId = sid;
        updateUser(u);
      }
      toast('Welcome, ' + name + '!');
    } else {
      toast('Welcome back, ' + u.name + '!');
    }
    if(norm === ADMIN_PHONE && u.role !== 'admin'){ u.role='admin'; updateUser(u); }
    set('session', { userId: u.id, loggedInAt: Date.now() });
    if(u.role === 'admin') go('s-admin', true);
    else go('s-home', true);
  }
  window.doLogin = doLogin;

  function applyFilters(){
    var listings = get('listings',[]).filter(function(l){ return l.status === 'active'; });
    var sellers = get('sellers',[]);
    var filtered = listings.filter(function(l){
      if(searchState.q){
        var q = searchState.q.toLowerCase();
        var hit = l.title.toLowerCase().indexOf(q) >= 0 || l.category.toLowerCase().indexOf(q) >= 0 || (l.description||'').toLowerCase().indexOf(q) >= 0;
        if(!hit) return false;
      }
      if(searchState.city && l.city !== searchState.city) return false;
      if(searchState.region && l.region !== searchState.region) return false;
      if(searchState.category && l.category !== searchState.category) return false;
      if(searchState.size || searchState.type){
        var s = sellers.find(function(x){ return x.id === l.sellerId; });
        if(!s) return false;
        if(searchState.size && s.size !== searchState.size) return false;
        if(searchState.type && s.type !== searchState.type) return false;
      }
      return true;
    });

    var countEl = document.getElementById('resultCount');
    var resEl = document.getElementById('searchResults');
    if(countEl) countEl.textContent = 'Results (' + filtered.length + ')';
    if(!resEl) return;

    if(filtered.length === 0){
      resEl.innerHTML = '<div class="empty"><div class="big">🔍</div><p>No listings match.</p></div>';
      return;
    }
    var h = '';
    for(var i=0;i<filtered.length;i++){
      var l = filtered[i];
      var s = sellerById(l.sellerId);
      h += '<div class="listing" onclick="openDetail(\'' + l.id + '\')">';
      h += '<div class="thumb">' + (l.icon||'📦') + '</div>';
      h += '<div class="info"><h4>' + esc(l.title) + (s && s.status==='approved' ? ' <span class="badge green">Verified</span>' : '') + '</h4>';

      h += '<div class="price">ETB ' + l.price.toLocaleString() + '</div></div></div>';
    }
    resEl.innerHTML = h;
  }
  window.applyFilters = applyFilters;

  function orderCard(o, perspective){
    var cls = 'badge';
    if(o.status === 'Pending') cls = 'badge red';
    else if(o.status === 'Confirmed') cls = 'badge blue';
    else if(o.status === 'Delivered') cls = 'badge green';
    else if(o.status === 'Cancelled') cls = 'badge red';

    var h = '';
    h += '<div class="card">';
    h += '<div class="row"><span><b>' + esc(o.listingTitle) + '</b></span><span class="' + cls + '">' + o.status + '</span></div>';
    h += '<div class="row"><span>' + (perspective==='buyer'?'Seller':'Buyer') + '</span><span>' + esc(perspective==='buyer'?o.sellerName:o.buyerName) + '</span></div>';
    h += '<div class="row"><span>Qty</span><span>' + o.qty + '</span></div>';
    h += '<div class="row"><span>Type</span><span>' + esc(o.type) + '</span></div>';
    h += '<div class="row"><span>Total</span><span><b style="color:#078930;">ETB ' + o.total.toLocaleString() + '</b></span></div>';
    h += '<div class="row"><span>Date</span><span>' + new Date(o.date).toLocaleDateString() + '</span></div>';

    if(perspective === 'seller' && o.status === 'Pending'){
      h += '<div class="btn-row"><button class="btn btn-outline btn-sm" style="flex:1;" onclick="updateOrder(\'' + o.id + '\',\'Cancelled\')">Cancel</button><button class="btn btn-primary btn-sm" style="flex:1;" onclick="updateOrder(\'' + o.id + '\',\'Confirmed\')">Confirm</button></div>';
    } else if(perspective === 'seller' && o.status === 'Confirmed'){
      h += '<div class="btn-row"><button class="btn btn-primary btn-sm" style="flex:1;" onclick="updateOrder(\'' + o.id + '\',\'Shipped\')">Mark Shipped</button></div>';
    } else if(perspective === 'buyer' && o.status === 'Shipped'){
      h += '<div class="btn-row"><button class="btn btn-primary btn-sm" style="flex:1;" onclick="updateOrder(\'' + o.id + '\',\'Delivered\')">Mark Delivered</button></div>';
    }
    h += '</div>';
    return h;
  }

  function updateOrder(id, status){

  function saveListing(){
    var u = currentUser();
    var title = document.getElementById('lfTitleIn').value.trim();
    var type = document.getElementById('lfType').value;
    var category = document.getElementById('lfCat').value;
    var description = document.getElementById('lfDesc').value.trim();
    var price = parseFloat(document.getElementById('lfPrice').value) || 0;
    var negotiable = document.getElementById('lfNeg').value === 'true';
    var city = document.getElementById('lfCity').value;
    var icon = document.getElementById('lfIcon').value || '📦';

    if(!title){ toast('Title required'); return; }
    if(!price){ toast('Price required'); return; }

    var arr = get('listings',[]);
    if(editingListingId){
      for(var i=0;i<arr.length;i++){
        if(arr[i].id === editingListingId){
          arr[i].title = title; arr[i].type = type; arr[i].category = category;
          arr[i].description = description; arr[i].price = price;
          arr[i].negotiable = negotiable; arr[i].city = city; arr[i].icon = icon;
        }
      }
      toast('Listing updated ✅');
    } else {
      arr.push({ id:uid('l'), title:title, type:type, category:category, description:description, price:price, negotiable:negotiable, city:city, region:u.region, sellerId:u.sellerId, icon:icon, status:'active', createdAt:Date.now() });
      toast('Listing published ✅');
    }
    set('listings', arr);
    editingListingId = null;
    go('s-dashboard');
  }

    h += '<div class="sec-title"><h3>Pending Approvals</h3></div>';
    var pendingSellers = sellers.filter(function(s){ return s.status === 'pending'; }).length;
    var pendingCoins = reqs.filter(function(r){ return r.status === 'pending'; }).length;

    h += '<div class="card" onclick="go(\'s-admin-sellers\')" style="cursor:pointer;background:#fff7d6;border-color:#fde68a;">';
    h += '<div class="row"><span>🏪 Seller approvals</span><span><b>' + pendingSellers + '</b> pending →</span></div></div>';
    h += '<div class="card" onclick="go(\'s-admin-coins\')" style="cursor:pointer;background:#fff7d6;border-color:#fde68a;">';
    h += '<div class="row"><span>🪙 Coin requests</span><span><b>' + pendingCoins + '</b> pending →</span></div></div>';

    h += '<div class="sec-title"><h3>Quick Tools</h3></div>';
    h += '<div class="card">';
    h += '<div class="row" onclick="go(\'s-admin-sellers\')" style="cursor:pointer;"><span>🏪 Manage Sellers</span><span>→</span></div>';
    h += '<div class="row" onclick="go(\'s-admin-coins\')" style="cursor:pointer;"><span>🪙 Coin Requests</span><span>→</span></div>';
    h += '<div class="row" onclick="toast(\'Cities management (demo)\')" style="cursor:pointer;"><span>🏙️ Manage Cities</span><span>→</span></div>';
    h += '<div class="row" onclick="toast(\'Categories management (demo)\')" style="cursor:pointer;"><span>📂 Manage Categories</span><span>→</span></div>';
    h += '<div class="row" onclick="toast(\'Monitoring (demo)\')" style="cursor:pointer;"><span>📊 Monitor Listings</span><span>→</span></div>';
    h += '<div class="row" onclick="toast(\'All orders (demo)\')" style="cursor:pointer;"><span>🧾 All Orders</span><span>→</span></div></div>';

    h += '<button class="btn btn-red" style="margin-top:12px;" onclick="logout()">🚪 Logout</button>';

    document.getElementById('adminBody').innerHTML = h;
  }
  window.renderAdmin = renderAdmin;

  function renderAdminSellers(){
    var sellers = get('sellers',[]);
    var h = '';
    if(sellers.length === 0) h = '<div class="empty"><p>No sellers.</p></div>';
    for(var i=0;i<sellers.length;i++){
      var s = sellers[i];
      var cls = s.status==='approved' ? 'badge green' : s.status==='pending' ? 'badge red' : 'badge';
      h += '<div class="card">';
      h += '<div class="row"><span><b>' + esc(s.name) + '</b></span><span class="' + cls + '">' + s.status + '</span></div>';
      h += '<div class="row"><span>📞 Phone</span><span>' + esc(s.phone) + '</span></div>';
      h += '<div class="row"><span>📍 Location</span><span>' + esc(s.city) + ', ' + esc(s.region) + '</span></div>';
      h += '<div class="row"><span>🏢 Size / Type</span><span>' + esc(s.size) + ' · ' + esc(s.type) + '</span></div>';
      h += '<div class="btn-row">';
      if(s.status !== 'approved') h += '<button class="btn btn-primary btn-sm" style="flex:1;" onclick="approveSeller(\'' + s.id + '\')">✔ Approve</button>';
      if(s.status !== 'blocked') h += '<button class="btn btn-red btn-sm" style="flex:1;" onclick="blockSeller(\'' + s.id + '\')">🚫 Block</button>';
      else h += '<button class="btn btn-primary btn-sm" style="flex:1;" onclick="approveSeller(\'' + s.id + '\')">Unblock</button>';
      h += '</div></div>';
    }
    document.getElementById('adminSellersBody').innerHTML = h;
  }
  window.renderAdminSellers = renderAdminSellers;

  function approveSeller(id){
    var s = sellerById(id);
    if(!s) return;
    s.status = 'approved';
    updateSeller(s);
    toast('Seller approved ✅');
    renderAdminSellers();
  }
  window.approveSeller = approveSeller;

  function blockSeller(id){
    var s = sellerById(id);
    if(!s) return;
    s.status = 'blocked';
    updateSeller(s);
    toast('Seller blocked');
    renderAdminSellers();
  }
  window.blockSeller = blockSeller;

  function renderAdminCoins(){
    var reqs = get('coinRequests',[]);
    var el = document.getElementById('adminCoinsBody');
    if(reqs.length === 0){ el.innerHTML = '<div class="empty"><div class="big">🪙</div><p>No coin requests yet.</p></div>'; return; }
    var h = '';
    for(var i=reqs.length-1;i>=0;i--){
      var r = reqs[i];
      var color = r.status==='approved'?'#078930':r.status==='rejected'?'#DA121A':'#92680a';
      h += '<div class="card">';
      h += '<div class="row"><span><b>' + esc(r.userName) + '</b></span><span style="color:' + color + ';font-weight:700;">' + r.status + '</span></div>';
      h += '<div class="row"><span>📞 Phone</span><span>' + esc(r.phone) + '</span></div>';
      h += '<div class="row"><span>🪙 Requested</span><span>' + r.coins + ' ሳንቲም = ETB ' + r.etb.toLocaleString() + '</span></div>';
      h += '<div class="row"><span>💳 Method</span><span>' + esc(r.method) + '</span></div>';
      h += '<div class="row"><span>🧾 FT Number</span><span>' + esc(r.ft) + '</span></div>';
      if(r.status === 'pending'){
        h += '<div class="btn-row"><button class="btn btn-red btn-sm" style="flex:1;" onclick="rejectCoin(\'' + r.id + '\')">✖ Reject</button><button class="btn btn-primary btn-sm" style="flex:1;" onclick="approveCoin(\'' + r.id + '\')">✔ Approve</button></div>';
      }
      h += '</div>';
    }
    el.innerHTML = h;
  }
  window.renderAdminCoins = renderAdminCoins;

  function approveCoin(id){
    var reqs = get('coinRequests',[]);
    var r = null;
    for(var i=0;i<reqs.length;i++) if(reqs[i].id === id) r = reqs[i];
    if(!r || r.status !== 'pending') return;

    var users = get('users',[]);
    var target = null, admin = null;
    for(var j=0;j<users.length;j++){
      if(users[j].id === r.userId) target = users[j];
      if(users[j].phone === ADMIN_PHONE) admin = users[j];
    }
    if(!target || !admin){ toast('User not found'); return; }
    if(admin.coins < r.coins){ toast('Admin wallet insufficient'); return; }

    admin.coins -= r.coins;
    target.coins += r.coins;
    r.status = 'approved';
    r.approvedAt = Date.now();

    set('users', users);
    set('coinRequests', reqs);

    toast('✅ Approved — ' + target.name + ' now has ' + target.coins + ' coins');
    renderAdminCoins();
  }
  window.approveCoin = approveCoin;

  function rejectCoin(id){
    var reqs = get('coinRequests',[]);
    for(var i=0;i<reqs.length;i++){
      if(reqs[i].id === id) reqs[i].status = 'rejected';
    }
    set('coinRequests', reqs);
    toast('Request rejected');
    renderAdminCoins();
  }
  window.rejectCoin = rejectCoin;

  /* ============================================================
     BOOT
     ============================================================ */
  (function boot(){
    var s = me();
    if(s){
      var u = currentUser();
      if(u){
        if(u.role === 'admin') go('s-admin', true);
        else go('s-home', true);
        return;
      }
    }
    go('s-splash', true);
  })();

})();
</script>
</body>
</html>
